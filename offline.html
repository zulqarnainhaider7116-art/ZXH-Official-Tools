<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline — ZXH Official Tools</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;background:#f1f5f9;color:#0f172a;font-family:system-ui,sans-serif;padding:24px;text-align:center}
.wrap{max-width:480px}
h1{font-size:clamp(64px,18vw,140px);font-weight:900;letter-spacing:-.04em;background:linear-gradient(135deg,#7000ff,#ff007f,#00f0ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:12px}
h2{font-size:clamp(22px,5vw,36px);font-weight:900;margin:0 0 12px;text-transform:uppercase}
p{color:#475569;font-size:15px;line-height:1.7;margin-bottom:22px}
a{display:inline-flex;align-items:center;gap:8px;padding:14px 24px;border-radius:999px;background:#0f172a;color:#fff;text-decoration:none;font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
a:hover{background:linear-gradient(135deg,#7000ff,#ff007f)}
</style>
</head>
<body>
<div class="wrap">
  <h1>ZXH</h1>
  <h2>You're Offline</h2>
  <p>The ZXH network is unreachable. Please check your connection and retry.</p>
  <a href="/">↻ RETRY NOW</a>
</div>
</body>
</html>
