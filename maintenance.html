<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#05070d">

    <title>Maintenance • ZXH OFFICIAL TOOLS</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                sans-serif;

            color: #fff;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(0,229,255,.13),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(139,92,246,.16),
                    transparent 35%
                ),
                #05070d;
        }

        .orb {
            position: fixed;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            filter: blur(90px);
            opacity: .3;
        }

        .orb.one {
            top: -120px;
            left: -100px;
            background: #00e5ff;
        }

        .orb.two {
            right: -100px;
            bottom: -120px;
            background: #8b5cf6;
        }

        .card {
            position: relative;
            width: 100%;
            max-width: 460px;
            padding: 42px 28px;
            text-align: center;

            background: rgba(255,255,255,.055);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 30px;

            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);

            box-shadow:
                0 30px 90px rgba(0,0,0,.5),
                inset 0 1px 0 rgba(255,255,255,.08);
        }

        .icon {
            width: 88px;
            height: 88px;
            margin: 0 auto 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 26px;

            font-size: 40px;

            background:
                linear-gradient(
                    135deg,
                    rgba(0,229,255,.14),
                    rgba(139,92,246,.18)
                );

            border: 1px solid rgba(0,229,255,.2);

            box-shadow:
                0 0 40px rgba(0,229,255,.12);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;

            padding: 7px 12px;
            margin-bottom: 17px;

            border-radius: 999px;

            color: #67e8f9;
            background: rgba(0,229,255,.08);
            border: 1px solid rgba(0,229,255,.15);

            font-size: 11px;
            font-weight: 800;
            letter-spacing: .8px;
            text-transform: uppercase;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #00e5ff;
            box-shadow: 0 0 12px #00e5ff;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            50% {
                opacity: .3;
                transform: scale(.7);
            }
        }

        h1 {
            font-size: 27px;
            font-weight: 900;
            margin-bottom: 11px;
        }

        p {
            color: #9ca3af;
            font-size: 14px;
            line-height: 1.75;
        }

        .status {
            margin-top: 24px;
            padding: 14px;

            border-radius: 15px;

            background: rgba(255,255,255,.035);
            border: 1px solid rgba(255,255,255,.07);

            color: #6b7280;
            font-size: 12px;
        }

        .brand {
            margin-top: 25px;

            color: #4b5563;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 2.5px;
        }
    </style>
</head>

<body>

    <div class="orb one"></div>
    <div class="orb two"></div>

    <main class="card">

        <div class="icon">
            🔧
        </div>

        <div class="badge">
            <span class="dot"></span>
            Maintenance Mode
        </div>

        <h1>
            We'll Be Back Soon
        </h1>

        <p>
            ZXH OFFICIAL TOOLS is temporarily under maintenance.
            We're upgrading the system to provide you with
            a better and more powerful experience.
        </p>

        <div class="status">
            ⚡ Please check back shortly.
        </div>

        <div class="brand">
            ZXH OFFICIAL TOOLS
        </div>

    </main>

</body>
</html>
