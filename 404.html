<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#05070d">

    <title>𝟒𝟎𝟒 • 𝐙𝐗𝐇 𝐎𝐅𝐅𝐈𝐂𝐈𝐀𝐋 𝐓𝐎𝐎𝐋𝐒</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 24px;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            color: #fff;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(0, 229, 255, .14),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(124, 58, 237, .18),
                    transparent 34%
                ),
                #05070d;
        }

        .glow {
            position: fixed;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            filter: blur(90px);
            opacity: .3;
            pointer-events: none;
        }

        .glow.one {
            top: -120px;
            left: -100px;
            background: #00e5ff;
        }

        .glow.two {
            right: -100px;
            bottom: -120px;
            background: #7c3aed;
        }

        .card {
            position: relative;
            width: 100%;
            max-width: 470px;
            padding: 42px 28px;
            text-align: center;

            border: 1px solid rgba(255, 255, 255, .1);
            border-radius: 30px;

            background: rgba(255, 255, 255, .055);

            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);

            box-shadow:
                0 35px 100px rgba(0, 0, 0, .5),
                inset 0 1px 0 rgba(255, 255, 255, .08);
        }

        .logo {
            width: 76px;
            height: 76px;
            margin: 0 auto 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 22px;

            background:
                linear-gradient(
                    135deg,
                    rgba(0, 229, 255, .16),
                    rgba(124, 58, 237, .18)
                );

            border: 1px solid rgba(0, 229, 255, .22);

            font-size: 27px;
            font-weight: 900;

            box-shadow:
                0 0 35px rgba(0, 229, 255, .12);
        }

        .error {
            font-size: clamp(72px, 20vw, 120px);
            line-height: .9;
            font-weight: 950;
            letter-spacing: -7px;

            background:
                linear-gradient(
                    135deg,
                    #ffffff,
                    #00e5ff,
                    #8b5cf6
                );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;

            margin-bottom: 18px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: 850;
        }

        p {
            color: #9ca3af;
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 28px;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-direction: column;
        }

        a,
        button {
            width: 100%;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, .1);

            font-size: 14px;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;

            transition:
                transform .2s ease,
                opacity .2s ease;
        }

        a:hover,
        button:hover {
            transform: translateY(-2px);
        }

        .home {
            color: #001014;
            border: none;

            background:
                linear-gradient(
                    135deg,
                    #00e5ff,
                    #67e8f9
                );
        }

        .back {
            color: #d1d5db;
            background: rgba(255, 255, 255, .045);
        }

        .brand {
            margin-top: 25px;

            font-size: 10px;
            font-weight: 800;
            letter-spacing: 2.5px;

            color: #4b5563;
        }

        @media (max-width: 420px) {
            .card {
                padding: 34px 20px;
                border-radius: 25px;
            }

            .error {
                letter-spacing: -5px;
            }
        }
    </style>
</head>

<body>

    <div class="glow one"></div>
    <div class="glow two"></div>

    <main class="card">

        <div class="logo">
            𝐙𝐗𝐇
        </div>

        <div class="error">
            404 🚀
        </div>

        <h1>
            𝐏𝐀𝐆𝐄 𝐍𝐎𝐓 𝐅𝐎𝐔𝐍𝐃 🫸
        </h1>

        <p>
            The page you're looking for doesn't exist,
            has been moved, or is temporarily unavailable.
        </p>

        <div class="actions">

            <a
                href="./index.html"
                class="home"
            >
                ← 𝐁𝐀𝐂𝐊 𝐓𝐎 𝐙𝐗𝐇 𝐎𝐅𝐅𝐈𝐂𝐈𝐀𝐋 𝐓𝐎𝐎𝐋𝐒 🤍 🌐 👈 🚀
            </a>

            <button
                type="button"
                class="back"
                onclick="history.back()"
            >
                Go Back
            </button>

        </div>

        <div class="brand">
            𝐙𝐗𝐇 𝐎𝐅𝐅𝐈𝐂𝐈𝐀𝐋 𝐓𝐎𝐎𝐋𝐒 ☠️🎭🚀
        </div>

    </main>

</body>
</html>
