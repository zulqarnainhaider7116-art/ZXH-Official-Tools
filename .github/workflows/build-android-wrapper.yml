name: Build ZXH Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - zxh-android-wrapper
    paths:
      - "android-wrapper/**"
      - ".github/workflows/build-android-wrapper.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download current website favicon for Android launcher icon
        run: |
          mkdir -p android-wrapper/app/src/main/res/drawable-nodpi
          curl -fL "https://zxh-official-tools-hub.vercel.app/assets/icon-512.png" -o android-wrapper/app/src/main/res/drawable-nodpi/ic_launcher.png

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android-wrapper
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZXH-OFFICIAL-TOOLKIT-APK
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
